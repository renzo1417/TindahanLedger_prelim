{% extends 'base.html' %}
{% load static %}

{% block title %}HOME SCREEN — TindaHan Digital Ledger{% endblock %}

{% block body_content %}
<div style="min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: var(--color-canvas-bg, #F9F8F6); margin: 0; padding: 24px; box-sizing: border-box;">
  <div class="anim-scale-in" style="text-align: center;">
    <!-- Simply the text HOME SCREEN at the center -->
    <h1 style="font-family: var(--font-serif, serif); font-size: clamp(38px, 6vw, 68px); font-weight: 800; letter-spacing: 3px; color: var(--color-ink-primary, #121212); margin: 0; text-transform: uppercase;">
      HOME SCREEN
    </h1>

    <!-- Direct action to easily transition back to Login in your video -->
    <div style="margin-top: 32px;">
      <a href="{% url 'accounts:logout' %}" class="btn btn-secondary btn-lg" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sign Out (Back to Login)</span>
      </a>
    </div>
  </div>
</div>
{% endblock body_content %}
