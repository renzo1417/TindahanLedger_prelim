<div id="log-utang-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="utang-modal-title">
  <div class="modal-dialog">
    <!-- Header -->
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-orange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        <h2 id="utang-modal-title" class="modal-title">Log Utang (Pautang Entry){% if customer %} • {{ customer.name }}{% endif %}</h2>
      </div>
      <button type="button" class="modal-close-btn" onclick="closeModal('log-utang-modal')" aria-label="Close modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Body -->
    <form method="POST" action="" onsubmit="showToast('Utang transaction recorded!', 'check'); closeModal('log-utang-modal');">
      {% csrf_token %}
      <input type="hidden" name="action_type" value="utang">

      {% if not customer %}
      <!-- Customer Picker if invoked globally -->
      <div class="form-group">
        <label for="id_utang_customer" class="form-label">
          Select Customer <span class="text-required">*</span>
        </label>
        <select id="id_utang_customer" name="customer_id" class="form-control form-select" required>
          <option value="">-- Choose debtor --</option>
          {% for c in global_search_customers %}
          <option value="{{ c.id }}">{{ c.name }} (₱{{ c.running_balance|floatformat:2 }})</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}

      <div class="form-group">
        <label for="id_utang_amount" class="form-label">
          Utang Amount (₱) <span class="text-required">*</span>
        </label>
        <div class="input-wrapper">
          <span class="input-leading-icon" style="font-family: var(--font-serif); font-weight: 700; font-size: 15px;">₱</span>
          <input 
            type="number" 
            step="0.01" 
            min="1" 
            id="id_utang_amount" 
            name="amount" 
            class="form-control" 
            placeholder="0.00" 
            required 
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label for="id_utang_items" class="form-label">Items Summary (Paninda)</label>
        <input 
          type="text" 
          id="id_utang_items" 
          name="items_summary" 
          class="form-control" 
          placeholder="e.g. 2x Noodles, 1x Bigas 1kg, Mantika"
        >
        <p class="form-helper">List of grocery goods or paninda taken on credit.</p>
        <!-- Quick Item Tags -->
        <div style="display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary btn-sm" style="padding: 2px 7px; font-size: 11px;" onclick="const el=document.getElementById('id_utang_items'); el.value = el.value ? el.value + ', Pancit Canton' : 'Pancit Canton';">+ Pancit Canton</button>
          <button type="button" class="btn btn-secondary btn-sm" style="padding: 2px 7px; font-size: 11px;" onclick="const el=document.getElementById('id_utang_items'); el.value = el.value ? el.value + ', Bigas 1kg' : 'Bigas 1kg';">+ Bigas 1kg</button>
          <button type="button" class="btn btn-secondary btn-sm" style="padding: 2px 7px; font-size: 11px;" onclick="const el=document.getElementById('id_utang_items'); el.value = el.value ? el.value + ', Kopiko Blanca' : 'Kopiko Blanca';">+ Kopiko Blanca</button>
          <button type="button" class="btn btn-secondary btn-sm" style="padding: 2px 7px; font-size: 11px;" onclick="const el=document.getElementById('id_utang_items'); el.value = el.value ? el.value + ', Surf Powder' : 'Surf Powder';">+ Surf Powder</button>
        </div>
      </div>

      <div class="form-group">
        <label for="id_utang_due_date" class="form-label">Target Payment Due Date</label>
        <input 
          type="date" 
          id="id_utang_due_date" 
          name="due_date" 
          class="form-control" 
          value="2026-08-30"
        >
      </div>

      <!-- Footer Buttons -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('log-utang-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Record Utang</button>
      </div>
    </form>
  </div>
</div>
