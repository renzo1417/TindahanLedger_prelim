<div id="add-product-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="add-prod-modal-title">
  <div class="modal-dialog modal-dialog-lg">
    <!-- Header -->
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <h2 id="add-prod-modal-title" class="modal-title">Register New Paninda Product</h2>
      </div>
      <button type="button" class="modal-close-btn" onclick="closeModal('add-product-modal')" aria-label="Close modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Body -->
    <form method="POST" action="{% url 'inventory:product_create' %}" onsubmit="showToast('Paninda registered to inventory!', 'check'); closeModal('add-product-modal');">
      {% csrf_token %}

      <!-- Product Name -->
      <div class="form-group">
        <label for="id_prod_name" class="form-label">
          Product Full Name <span class="text-required">*</span>
        </label>
        <div class="input-wrapper">
          <span class="input-leading-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          </span>
          <input 
            type="text" 
            id="id_prod_name" 
            name="name" 
            class="form-control" 
            placeholder="e.g. Piattos Cheese 85g" 
            required 
            autofocus
          >
        </div>
      </div>

      <!-- Category & Unit -->
      <div class="form-grid-2">
        <div class="form-group">
          <label for="id_category" class="form-label">Product Category</label>
          <select id="id_category" name="category" class="form-control form-select">
            <option value="Instant Noodles">Instant Noodles</option>
            <option value="Beverages">Beverages</option>
            <option value="Canned Goods">Canned Goods</option>
            <option value="Snacks & Candies">Snacks & Candies</option>
            <option value="Household">Household</option>
            <option value="Condiments">Condiments</option>
          </select>
        </div>

        <div class="form-group">
          <label for="id_unit" class="form-label">Unit of Measure</label>
          <select id="id_unit" name="unit" class="form-control form-select">
            <option value="pack">Per pack</option>
            <option value="pc">Per pc</option>
            <option value="can">Per can</option>
            <option value="bottle">Per bottle</option>
            <option value="sachet">Per sachet</option>
            <option value="kg">Per kg</option>
          </select>
        </div>
      </div>

      <!-- Pricing: Selling Price & Cost Price -->
      <div class="form-grid-2">
        <div class="form-group">
          <label for="id_selling_price" class="form-label">
            Selling Presyo (₱) <span class="text-required">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-leading-icon" style="font-family: var(--font-serif); font-weight: 700; font-size: 15px;">₱</span>
            <input 
              type="number" 
              step="0.25" 
              min="0.50" 
              id="id_selling_price" 
              name="selling_price" 
              class="form-control" 
              placeholder="0.00" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="id_cost_price" class="form-label">
            Puhunan / Cost (₱) <span class="text-required">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-leading-icon" style="font-family: var(--font-serif); font-weight: 700; font-size: 15px;">₱</span>
            <input 
              type="number" 
              step="0.25" 
              min="0.00" 
              id="id_cost_price" 
              name="cost_price" 
              class="form-control" 
              placeholder="0.00" 
              required
            >
          </div>
        </div>
      </div>

      <!-- Initial Stock & Low Stock Threshold -->
      <div class="form-grid-2">
        <div class="form-group">
          <label for="id_stock_qty" class="form-label">Initial Stock Count</label>
          <input 
            type="number" 
            min="0" 
            id="id_stock_qty" 
            name="stock_quantity" 
            class="form-control" 
            value="24"
          >
        </div>

        <div class="form-group">
          <label for="id_threshold" class="form-label">Low Stock Threshold</label>
          <input 
            type="number" 
            min="1" 
            id="id_threshold" 
            name="low_stock_threshold" 
            class="form-control" 
            value="10"
          >
        </div>
      </div>

      <!-- Expiry Option -->
      <div class="form-group">
        <label class="checkbox-card" style="margin-bottom: 0;">
          <input type="checkbox" name="has_expiry" id="id_has_expiry_toggle">
          <div>
            <span style="font-weight: 600; font-size: 13px;">Monitor printed expiration date</span>
            <p style="font-size: 11px; color: var(--color-ink-muted); margin: 0;">Flag as expiring in FIFO inventory tracking.</p>
          </div>
        </label>
      </div>

      <!-- Footer Buttons -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('add-product-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Paninda</button>
      </div>
    </form>
  </div>
</div>
