<div id="restock-batch-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="restock-modal-title">
  <div class="modal-dialog">
    <!-- Header -->
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <h2 id="restock-modal-title" class="modal-title">Restock Inventory Batch (FIFO)</h2>
      </div>
      <button type="button" class="modal-close-btn" onclick="closeModal('restock-batch-modal')" aria-label="Close modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Body -->
    <form method="POST" action="" onsubmit="showToast('New stock batch added to inventory!', 'check'); closeModal('restock-batch-modal');">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_batch_code" class="form-label">
          Batch Identifier Code <span class="text-required">*</span>
        </label>
        <input 
          type="text" 
          id="id_batch_code" 
          name="batch_code" 
          class="form-control" 
          value="BT-2026-0099" 
          required
        >
        <p class="form-helper">Suggested format: BT-[YYYY]-[BatchNumber]</p>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label for="id_batch_qty" class="form-label">
            Quantity Added <span class="text-required">*</span>
          </label>
          <input 
            type="number" 
            min="1" 
            id="id_batch_qty" 
            name="quantity" 
            class="form-control" 
            value="12" 
            required
          >
        </div>

        <div class="form-group">
          <label for="id_batch_cost" class="form-label">Puhunan / Cost (₱)</label>
          <input 
            type="number" 
            step="0.01" 
            id="id_batch_cost" 
            name="cost_price" 
            class="form-control" 
            value="14.50"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="id_batch_expiry" class="form-label">Printed Expiration Date</label>
        <input 
          type="date" 
          id="id_batch_expiry" 
          name="expiry_date" 
          class="form-control" 
          value="2027-02-15"
        >
        <p class="form-helper">FIFO rotation algorithm uses this date to prioritize shelf sales order.</p>
      </div>

      <!-- Footer Buttons -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('restock-batch-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Restock Batch</button>
      </div>
    </form>
  </div>
</div>
