<header class="masthead">
  <!-- Sub-bar: Date & Volume Info -->
  <div class="masthead-subbar">
    <div class="masthead-sub-left">
      <span class="live-dot live-dot-pulse"></span>
      <span>{{ store_name|default:"TindaHan Ledger" }}</span>
      <span class="dot-sep">·</span>
      <span>{{ current_date|default:"Today" }}</span>
    </div>
    <div>
      <span>Ledger Vol. V</span>
    </div>
  </div>

  <!-- Main Masthead Row -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div>
      <h1 style="font-family: var(--font-serif); font-size: 18px; font-weight: 700; color: var(--color-ink-primary); line-height: 1.2;">
        {% block page_heading %}Daily Store Overview{% endblock %}
      </h1>
      <p style="font-size: 12px; color: var(--color-ink-muted); margin-top: 2px;">
        {% block page_subheading %}{{ store_name|default:"TindaHan Ledger" }} · {{ owner_name|default:"Store Owner" }}{% endblock %}
      </p>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <!-- Quick Actions -->
      <button type="button" class="btn-icon-only btn-ghost" onclick="showToast('Notifications coming soon!', 'info')" title="Notifications">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </button>
    </div>
  </div>
</header>
