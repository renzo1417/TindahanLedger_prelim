<div id="log-bayad-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="bayad-modal-title">
  <div class="modal-dialog">
    <!-- Header -->
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <h2 id="bayad-modal-title" class="modal-title">Log Bayad (Payment Received){% if customer %} • {{ customer.name }}{% endif %}</h2>
      </div>
      <button type="button" class="modal-close-btn" onclick="closeModal('log-bayad-modal')" aria-label="Close modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Body -->
    <form method="POST" action="" onsubmit="showToast('Payment successfully logged to ledger!', 'check'); closeModal('log-bayad-modal');">
      {% csrf_token %}
      <input type="hidden" name="action_type" value="bayad">

      {% if not customer %}
      <!-- Customer Picker if invoked globally -->
      <div class="form-group">
        <label for="id_bayad_customer" class="form-label">
          Select Customer <span class="text-required">*</span>
        </label>
        <select id="id_bayad_customer" name="customer_id" class="form-control form-select" required>
          <option value="">-- Choose debtor --</option>
          {% for c in global_search_customers %}
          <option value="{{ c.id }}">{{ c.name }} (₱{{ c.running_balance|floatformat:2 }})</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="id_bayad_amount" class="form-label" style="margin-bottom: 0;">
            Bayad Amount (₱) <span class="text-required">*</span>
          </label>
          {% if customer and customer.running_balance > 0 %}
          <button 
            type="button" 
            class="btn-ghost" 
            style="font-size: 11px; padding: 0; min-height: auto; color: #10B981; font-weight: 700;"
            onclick="document.getElementById('id_bayad_amount').value = '{{ customer.running_balance }}';"
          >
            Pay Full: ₱{{ customer.running_balance|floatformat:2 }}
          </button>
          {% endif %}
        </div>
        <div class="input-wrapper" style="margin-top: 6px;">
          <span class="input-leading-icon" style="font-family: var(--font-serif); font-weight: 700; font-size: 15px;">₱</span>
          <input 
            type="number" 
            step="0.01" 
            min="1" 
            id="id_bayad_amount" 
            name="amount" 
            class="form-control" 
            placeholder="0.00" 
            required 
            autofocus
          >
        </div>

        <!-- Quick Shortcut Bills -->
        <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
          {% if customer and customer.running_balance > 0 %}
          <button type="button" class="btn btn-secondary btn-sm" style="padding: 2px 8px; font-size: 11px; font-weight: 700; color: #065F46; background-color: var(--color-status-success-bg); border-color: var(--color-status-success-border);" onclick="document.getElementById('id_bayad_amount').value = '{{ customer.running_balance }}';">
            Full (₱{{ customer.running_balance|floatformat:0 }})
          </button>
          {% endif %}
          <button type="button" class="btn btn-secondary btn-sm" style="padding: 2px 8px; font-size: 11px;" onclick="document.getElementById('id_bayad_amount').value = '100';">₱100</button>
          <button type="button" class="btn btn-secondary btn-sm" style="padding: 2px 8px; font-size: 11px;" onclick="document.getElementById('id_bayad_amount').value = '200';">₱200</button>
          <button type="button" class="btn btn-secondary btn-sm" style="padding: 2px 8px; font-size: 11px;" onclick="document.getElementById('id_bayad_amount').value = '500';">₱500</button>
          <button type="button" class="btn btn-secondary btn-sm" style="padding: 2px 8px; font-size: 11px;" onclick="document.getElementById('id_bayad_amount').value = '1000';">₱1,000</button>
        </div>
      </div>

      <div class="form-group">
        <label for="id_payment_mode" class="form-label">Payment Mode</label>
        <select id="id_payment_mode" name="payment_mode" class="form-control form-select">
          <option value="Cash">Cash (Tindahan Handover)</option>
          <option value="GCash">GCash Transfer</option>
          <option value="Maya">Maya Transfer</option>
          <option value="Other">Other Mode</option>
        </select>
      </div>

      <div class="form-group">
        <label for="id_bayad_notes" class="form-label">Notes / Remarks</label>
        <input 
          type="text" 
          id="id_bayad_notes" 
          name="notes" 
          class="form-control" 
          placeholder="e.g. Paid in full via GCash or Partial ₱500"
        >
      </div>

      <!-- Footer Buttons -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('log-bayad-modal')">Cancel</button>
        <button type="submit" class="btn btn-success">Record Payment</button>
      </div>
    </form>
  </div>
</div>
